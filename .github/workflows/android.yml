# Faro for Android (WebView app, package com.oscarvelz.faro). Runs only on the `source` branch when android/ changes
# (or by hand); it never touches `main` or GitHub Pages.
# The signing key is NOT in this public repo. If the repository secrets FARO_KS_B64 (base64 of the PKCS12 keystore)
# and FARO_KS_PASS exist, the APK is signed here and published as release android-<run number> with Faro.apk.
# Without them the job uploads an unsigned APK artifact, which is signed privately with the same key and published
# under the same android-<run number> tag. Every update must be signed with that one key or Android refuses it.
name: Faro for Android
on:
  push:
    branches: [source]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: faro-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Signing key (only if the secrets exist)
        env:
          KS_B64: ${{ secrets.FARO_KS_B64 }}
          KS_PASS: ${{ secrets.FARO_KS_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/faro.p12"
            echo "FARO_KS_FILE=$RUNNER_TEMP/faro.p12" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          FARO_KS_PASS: ${{ secrets.FARO_KS_PASS }}
      - name: Collect
        run: |
          ls -la android/app/build/outputs/apk/release/
          if [ "$SIGNED" = "1" ]; then cp android/app/build/outputs/apk/release/app-release.apk Faro.apk
          else cp android/app/build/outputs/apk/release/app-release-unsigned.apk Faro-unsigned.apk; fi
          rm -f "$RUNNER_TEMP/faro.p12"
      - name: Unsigned APK (signed privately afterwards)
        if: env.SIGNED != '1'
        uses: actions/upload-artifact@v4
        with:
          name: faro-unsigned-${{ github.run_number }}
          path: Faro-unsigned.apk
          retention-days: 14
      - name: Release
        if: env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Faro para Android ${{ github.run_number }}
          body: Instala Faro.apk en el teléfono. La app abre https://oscarvelz.github.io/Faro/ con su propio almacenamiento; entra con tu cuenta para traer tus libros.
          files: Faro.apk
          make_latest: 'true'
