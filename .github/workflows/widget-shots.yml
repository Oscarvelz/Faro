# Faro for Android widgets (1.3.121): compile the app and render the home-screen widgets to PNG with Robolectric
# (native graphics, the real RemoteViews layouts), night and day, phone and tablet sizes. Runs on the work branch
# `widget-dev` or by hand; it never releases anything and never touches `main`, `source` releases or GitHub Pages.
name: Faro widget shots
on:
  push:
    branches: [widget-dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build + shots
        working-directory: android
        run: gradle assembleRelease testReleaseUnitTest --no-daemon --stacktrace
      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-widget-shots-${{ github.run_number }}
          path: |
            android/app/build/shots/
            android/app/build/reports/tests/
          retention-days: 7
